name: CI — Smoke + E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  renegade-ui:
    name: Renegade UI Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create venv and install dependencies
        run: |
          python -m venv venv
          venv/bin/pip install -r renegade-ui-tests/requirements.txt

      - name: Install Playwright browsers
        run: venv/bin/playwright install --with-deps chromium

      - name: Install Allure CLI
        run: |
          wget -qO allure.tgz https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -xzf allure.tgz
          sudo mv allure-2.29.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure

      - name: Create .env
        run: |
          cat > renegade-ui-tests/.env <<EOF
          ENV=${{ secrets.ENV }}
          QA_URL=${{ secrets.QA_URL }}
          QA_USERNAME=${{ secrets.QA_USERNAME }}
          QA_PASSWORD=${{ secrets.QA_PASSWORD }}
          QA_TOTP_SECRET=${{ secrets.QA_TOTP_SECRET }}
          BROWSER=chromium
          HEADLESS=true
          EOF

      - name: Run smoke tests
        working-directory: renegade-ui-tests
        run: |
          ../venv/bin/pytest -m smoke -v 2>&1 | tee smoke_results.txt || true
          SMOKE=$(grep -E "passed|failed|error" smoke_results.txt | tail -1 | tr -d '=' | xargs)
          echo "SMOKE_SUMMARY=${SMOKE:-No smoke tests found}" >> $GITHUB_ENV

      - name: Run e2e tests
        working-directory: renegade-ui-tests
        run: |
          ../venv/bin/pytest -m e2e -v 2>&1 | tee e2e_results.txt || true
          E2E=$(grep -E "passed|failed|error" e2e_results.txt | tail -1 | tr -d '=' | xargs)
          echo "E2E_SUMMARY=${E2E:-No e2e tests found}" >> $GITHUB_ENV

      - name: Generate Allure report
        if: always()
        working-directory: renegade-ui-tests
        run: allure generate allure-results --clean -o allure-report

      - name: Deploy Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: renegade-ui-tests/allure-report
          destination_dir: renegade-ui
          keep_files: true

      - name: Upload Allure report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renegade-ui-allure-report
          path: renegade-ui-tests/allure-report/
          retention-days: 7

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: renegade-ui-screenshots
          path: renegade-ui-tests/screenshots/
          retention-days: 7

      - name: Send email report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: dilip.ale@renegadeinsurance.com
          from: QA Automation <${{ secrets.MAIL_USERNAME }}>
          subject: "[${{ job.status == 'success' && 'PASSED' || 'FAILED' }}] Renegade UI — CI Results — ${{ github.ref_name }}"
          body: |
            ==========================================
            RENEGADE UI — CI TEST RESULTS
            ==========================================
            Branch  : ${{ github.ref_name }}
            Commit  : ${{ github.sha }}
            Status  : ${{ job.status }}
            ------------------------------------------
            SMOKE TESTS : ${{ env.SMOKE_SUMMARY }}
            E2E TESTS   : ${{ env.E2E_SUMMARY }}
            ------------------------------------------
            Allure Report (click to view):
            https://dilipale.github.io/rng_ui_tests/renegade-ui/
            ==========================================

