name: Smoke Tests

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  renegade-ui-smoke:
    name: Renegade UI Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create venv and install dependencies
        run: |
          python -m venv venv
          venv/bin/pip install -r renegade-ui-tests/requirements.txt

      - name: Install Playwright browsers
        run: venv/bin/playwright install --with-deps chromium

      - name: Install Allure CLI
        run: |
          wget -qO allure.tgz https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -xzf allure.tgz
          sudo mv allure-2.29.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure

      - name: Create .env
        run: |
          cat > renegade-ui-tests/.env <<EOF
          ENV=${{ secrets.ENV }}
          QA_URL=${{ secrets.QA_URL }}
          QA_USERNAME=${{ secrets.QA_USERNAME }}
          QA_PASSWORD=${{ secrets.QA_PASSWORD }}
          QA_TOTP_SECRET=${{ secrets.QA_TOTP_SECRET }}
          BROWSER=chromium
          HEADLESS=true
          EOF

      - name: Run smoke tests
        working-directory: renegade-ui-tests
        run: ../venv/bin/pytest -m smoke -v
        continue-on-error: true

      - name: Generate Allure report
        working-directory: renegade-ui-tests
        run: allure generate allure-results --clean -o allure-report

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: renegade-ui-allure-report
          path: renegade-ui-tests/allure-report/
          retention-days: 7

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: renegade-ui-screenshots
          path: renegade-ui-tests/screenshots/
          retention-days: 7

      - name: Send email report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.office365.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: dilip.ale@renegadeinsurance.com
          from: QA Automation <${{ secrets.MAIL_USERNAME }}>
          subject: "[${{ job.status == 'success' && 'PASSED' || 'FAILED' }}] Renegade UI Smoke Tests — ${{ github.ref_name }}"
          body: |
            Smoke test run completed for branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Status: ${{ job.status }}

            Download the full Allure report from GitHub Actions artifacts:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

